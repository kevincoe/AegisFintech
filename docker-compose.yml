services:
  postgres:
    image: postgres:17-alpine
    container_name: aegis_fintech_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis_dev_password
      POSTGRES_DB: aegis_fintech
    ports:
      - "5432:5432"
    volumes:
      - aegis_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis_fintech"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  aegis_pg_data:
